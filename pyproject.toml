[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "slm-eval"
version = "0.1.0"
description = "Agentic evaluation harness for SLM fine-tuning — eval-gate-first, single-tenant, CLI"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2",
    "openai>=1",
    "tenacity",
    "numpy",
    "datasketch",
    "pyyaml",
    "jinja2",
]

[project.scripts]
slm-eval = "slm_eval.cli:main"

[project.optional-dependencies]
train = [
    "torch",
    "transformers",
    "peft",
    "trl",
    "datasets",
    "accelerate",
    "wandb",
]
train-gpu = [
    "torch",
    "transformers",
    "peft",
    "trl",
    "datasets",
    "accelerate",
    "wandb",
    "bitsandbytes",
]
serve = ["vllm"]
ocr = ["pytesseract", "Pillow"]
viz = ["matplotlib", "seaborn"]

[dependency-groups]
dev = ["pytest", "ruff"]

[tool.setuptools.packages.find]
include = ["slm_eval*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
