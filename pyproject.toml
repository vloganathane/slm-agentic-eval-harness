[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "slm-eval"
version = "0.1.0"
description = "Agentic evaluation harness for SLM fine-tuning — eval-gate-first, single-tenant, CLI"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "Loganathan Ev", email = "loganathan@example.com"}
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Testing",
]
keywords = [
    "llm",
    "slm",
    "evaluation",
    "fine-tuning",
    "lora",
    "vllm",
    "modal",
]
dependencies = [
    "pydantic>=2",
    "openai>=3.46.0",
    "tenacity",
    "numpy",
    "datasketch",
    "pyyaml",
    "jinja2",
]

[project.urls]
Homepage = "https://github.com/yourusername/slm-agentic-eval-harness"
Repository = "https://github.com/yourusername/slm-agentic-eval-harness"
Issues = "https://github.com/yourusername/slm-agentic-eval-harness/issues"
Documentation = "https://github.com/yourusername/slm-agentic-eval-harness#readme"
Changelog = "https://github.com/yourusername/slm-agentic-eval-harness/blob/main/CHANGELOG.md"

[project.scripts]
slm-eval = "slm_eval.cli:main"

[project.optional-dependencies]
train = [
    "torch",
    "transformers",
    "peft",
    "trl",
    "datasets",
    "accelerate",
    "wandb",
]
train-gpu = [
    "torch",
    "transformers",
    "peft",
    "trl",
    "datasets",
    "accelerate",
    "wandb",
    "bitsandbytes",
]
modal = ["modal"]
serve = ["vllm"]
ocr = ["pytesseract", "Pillow"]
viz = ["matplotlib", "seaborn"]
docling = ["docling"]

# Multi-provider inference
anthropic = ["anthropic"]
google = ["google-generativeai"]
mistral = ["mistralai"]
together = ["together"]  # uses openai
groq = ["groq"]  # uses openai
fireworks = ["fireworks"]  # uses openai

# Multi-provider training
axolotl = ["axolotl"]
llama-factory = ["llamafactory"]
unsloth = ["unsloth"]

# Multi-provider serving
tgi = ["text-generation"]
sglang = ["sglang"]

# All providers
providers = ["anthropic", "google-generativeai", "mistralai", "together", "groq"]

all = ["train", "modal", "serve", "ocr", "viz", "providers"]

[dependency-groups]
dev = ["pytest", "ruff", "pytest-cov"]

[tool.setuptools.packages.find]
include = ["slm_eval*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
]
ignore = ["E501"]  # line too long (handled by formatter)

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.coverage.run]
source = ["slm_eval"]
omit = ["tests/*", "*/__pycache__/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    'if __name__ == "__main__":',
]
