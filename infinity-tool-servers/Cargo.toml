[workspace]
members = [
    "web-search-server",
    "inference-server",
    "minhash-server",
    "review-server",
    "scoring-server",
    "gate-server",
    "synthetic-server",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"

[workspace.dependencies]
# RAP protocol
rap-protocol = { path = "/tmp/infinity/crates/rap-protocol" }
rap-client = { path = "/tmp/infinity/crates/rap-client" }

# Web framework
axum = { version = "0.8", features = ["macros", "multipart"] }
tower = "0.5"
tower-http = { version = "0.7", features = ["cors", "trace", "timeout", "set-header"] }

# HTTP client
reqwest = { version = "0.12", features = ["json", "rustls-tls"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Async
tokio = { version = "1", features = ["rt-multi-thread", "net", "signal", "macros", "time", "sync", "io-util", "io-std"] }
futures = "0.3"
async-trait = "0.1"

# Config
clap = { version = "4", features = ["derive", "env"] }

# Error handling
thiserror = "2"
anyhow = "1"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# Crypto
sha2 = "0.10"
hex = "0.4"

# Database
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite", "json", "chrono", "uuid"] }
uuid = { version = "1", features = ["v4", "serde"] }

# Random
rand = "0.8"

[profile.release]
lto = true
codegen-units = 1
strip = true