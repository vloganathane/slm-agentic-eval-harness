# Infinity Daemon Configuration for slm_eval
# 
# Run: infinity-daemon --config daemon.toml

[conversation_store]
type = "sqlite"
path = "runs/infinity_conversations.db"

[state_store]
type = "sqlite"
path = "runs/infinity_state.db"

[model_provider]
type = "openai_compat"
base_url = "http://localhost:8080/v1"
default_model = "qwen2.5-1.5b-instruct"
# Optional: API key if needed
# api_key = "local"

[rap_toolsets]
# Web Search Server
web_search = { type = "toolset_server", server_url = "http://localhost:8001" }

# Inference Server (llama-server)
inference = { type = "toolset_server", server_url = "http://localhost:8002" }

# MinHash Deduplication
minhash = { type = "toolset_server", server_url = "http://localhost:8003" }

# Human Review Queue
review = { type = "toolset_server", server_url = "http://localhost:8004" }

# Scoring (micro-F1, bootstrap CI, Cohen's κ)
scoring = { type = "toolset_server", server_url = "http://localhost:8005" }

# Promotion Gate
gate = { type = "toolset_server", server_url = "http://localhost:8006" }

# Synthetic Generation
synthetic = { type = "toolset_server", server_url = "http://localhost:8007" }

[builtin_tools]
enabled = true
# Includes: spawn_thread, sleep_until_event_or_input, report_to_parent, close_thread, send_message_to_child, cancel_subscription

[agent]
# Default system prompt for eval orchestrator
system_prompt = """
You are the EvalOrchestrator agent for the SLM Evaluation Harness.

Your job: Run the complete evaluation pipeline for fine-tuning SLMs on receipt/invoice extraction.

PIPELINE STAGES:
1. SPLIT - Stratified split dataset into train/holdout, seal holdout
2. INFERENCE - Run model on holdout cases, produce predictions
3. SCORING - Score predictions (element-level micro-F1, bootstrap CI)
4. JUDGE - Calibrate judge (Cohen's κ), judge fuzzy fields
5. GATE - CI-lower-bound decision (promote/blocked/error)
6. SYNTHETIC (if blocked) - Generate synthetic cases, human review, inject
7. REPEAT - Loop until N consecutive passes

TOOLS AVAILABLE:
- web_search: Find real merchant/item data
- run_inference: Call model on cases
- minhash_dedup: Deduplicate against holdout
- human_review: Submit to review queue, wait for human
- score_cases: Compute micro-F1 + bootstrap CI
- evaluate_gate: Promotion decision
- generate_synthetic: Create synthetic cases

RULES:
- ALWAYS use minhash_dedup before injecting synthetic cases
- ALWAYS wait for human_review to resolve before continuing
- Gate decision uses CI LOWER BOUND, never point estimate
- κ ≥ 0.85 required for subjective fields
- Exit codes: 0=promote, 1=blocked, 2=error

OUTPUT: Final gate.json with decision, CI, strata breakdown
"""

[thread]
# Thread configuration
default_tools = ["web_search", "run_inference", "minhash_dedup", "human_review", "score_cases", "evaluate_gate", "generate_synthetic"]
max_steps = 100