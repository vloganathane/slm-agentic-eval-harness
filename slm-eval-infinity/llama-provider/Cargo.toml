[package]
name = "llama-provider"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
infinity-provider-protocol = { path = "/tmp/infinity/crates/infinity-provider-protocol", version = "^0.2.0", features = ["remote"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
tokio-stream = "0.1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
async-trait = "0.1"
reqwest = { version = "0.12", features = ["json", "rustls-tls", "stream"] }
uuid = { version = "1", features = ["v4"] }
futures-util = "0.3"
anyhow = "1"
async-stream = "0.3"