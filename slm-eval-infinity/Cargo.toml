[package]
name = "slm-eval-infinity"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "SLM Evaluation Harness on Infinity Agent Runtime"

[dependencies]
# Web & HTTP
axum = { version = "0.8", features = ["macros", "multipart"] }
tower = "0.5"
tower-http = { version = "0.7", features = ["cors", "trace", "timeout", "set-header"] }
reqwest = { version = "0.12", features = ["json", "rustls-tls"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"

# Async
tokio = { version = "1", features = ["rt-multi-thread", "net", "signal", "macros", "time", "sync", "io-util", "io-std", "process"] }
futures = "0.3"
async-trait = "0.1"

# Config & CLI
clap = { version = "4", features = ["derive", "env"] }
toml = "0.8"
config = "0.14"

# Database
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite", "json", "chrono", "uuid"] }
uuid = { version = "1", features = ["v4", "serde"] }

# Error handling
thiserror = "2"
anyhow = "1"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# Crypto
sha2 = "0.10"
hex = "0.4"
regex = "1"

[dev-dependencies]
tokio-test = "0.4"
